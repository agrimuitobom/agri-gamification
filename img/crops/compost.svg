<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="roof" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="post" x1="0" x2="1"><stop offset="0" stop-color="#7c4a26"/><stop offset=".45" stop-color="#c58b55"/><stop offset="1" stop-color="#5b3419"/></linearGradient>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b2416"/><stop offset="1" stop-color="#1f130b"/></linearGradient>
    <radialGradient id="heap" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#a87a52"/><stop offset=".55" stop-color="#6b4429"/><stop offset="1" stop-color="#3a2416"/></radialGradient>
    <radialGradient id="ground" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#9a7b5a"/><stop offset="1" stop-color="#6b4f35"/></radialGradient>
    <linearGradient id="fork" x1="0" x2="1"><stop offset="0" stop-color="#9ca3af"/><stop offset=".5" stop-color="#f3f4f6"/><stop offset="1" stop-color="#6b7280"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <ellipse cx="64" cy="114" rx="56" ry="10" fill="url(#ground)"/>
  <!-- 奥の壁 -->
  <rect x="18" y="50" width="92" height="62" fill="url(#wall)"/>
  <!-- 堆肥の山 -->
  <path d="M24 112 C30 82 48 70 64 70 C82 70 98 82 104 112Z" fill="url(#heap)"/>
  <g fill="#c49a6c" opacity=".7"><circle cx="50" cy="86" r="2"/><circle cx="72" cy="82" r="2.5"/><circle cx="62" cy="96" r="2"/><circle cx="86" cy="98" r="2"/><circle cx="40" cy="102" r="2"/></g>
  <g stroke="#e7c37a" stroke-width="1.6" stroke-linecap="round" opacity=".8"><path d="M44 94 l6 -3"/><path d="M78 92 l7 2"/><path d="M60 104 l5 -4"/><path d="M90 106 l5 -3"/></g>
  <ellipse cx="54" cy="78" rx="10" ry="4" fill="#c49a6c" opacity=".55" filter="url(#blur)"/>
  <!-- 湯気（発酵熱） -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85" filter="url(#blur)">
    <path d="M52 66 c-6 -6 6 -10 0 -18"/><path d="M68 64 c-6 -6 6 -10 0 -18"/><path d="M82 68 c-5 -5 5 -9 0 -15"/>
  </g>
  <!-- 柱 -->
  <rect x="14" y="44" width="9" height="70" rx="2" fill="url(#post)"/>
  <rect x="105" y="44" width="9" height="70" rx="2" fill="url(#post)"/>
  <!-- 屋根（波板） -->
  <path d="M4 50 L64 14 L124 50 L116 56 L64 26 L12 56Z" fill="url(#roof)"/>
  <g stroke="#fca5a5" stroke-width="1.6" opacity=".7"><path d="M24 42 L64 18"/><path d="M104 42 L64 18"/></g>
  <path d="M12 56 L64 26 L116 56" stroke="#450a0a" stroke-width="2" fill="none" opacity=".5"/>
  <!-- フォーク -->
  <rect x="98" y="62" width="4" height="50" rx="2" fill="#b07a45" transform="rotate(12 100 87)"/>
  <g fill="url(#fork)" transform="rotate(12 100 87)"><rect x="92" y="54" width="16" height="4" rx="2"/><rect x="92" y="44" width="3" height="12" rx="1.5"/><rect x="98.5" y="44" width="3" height="12" rx="1.5"/><rect x="105" y="44" width="3" height="12" rx="1.5"/></g>
</svg>
