<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="pipe" x1="0" x2="1"><stop offset="0" stop-color="#6b7280"/><stop offset=".35" stop-color="#f3f4f6"/><stop offset=".6" stop-color="#c4c9d1"/><stop offset="1" stop-color="#4b5563"/></linearGradient>
    <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#9a6a1a"/><stop offset=".35" stop-color="#fde68a"/><stop offset=".65" stop-color="#d4a017"/><stop offset="1" stop-color="#7c5210"/></linearGradient>
    <linearGradient id="head" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset=".45" stop-color="#e11d48"/><stop offset="1" stop-color="#881337"/></linearGradient>
    <linearGradient id="nozzle" x1="0" x2="1"><stop offset="0" stop-color="#9ca3af"/><stop offset=".5" stop-color="#f9fafb"/><stop offset="1" stop-color="#6b7280"/></linearGradient>
    <radialGradient id="ground" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#86c95a"/><stop offset="1" stop-color="#3f8f2a"/></radialGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0f7ff"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <radialGradient id="drop" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <!-- 地面 -->
  <ellipse cx="64" cy="116" rx="34" ry="9" fill="url(#ground)"/>
  <ellipse cx="56" cy="113" rx="14" ry="3" fill="#b9e58f" opacity=".7"/>
  <!-- 水の弧（左右） -->
  <path d="M60 34 C40 18 18 22 6 46" stroke="url(#water)" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M60 34 C42 24 26 28 16 50" stroke="#e0f7ff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M74 30 C96 10 118 18 124 44" stroke="url(#water)" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M74 30 C94 16 112 22 118 44" stroke="#e0f7ff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9"/>
  <!-- しずく -->
  <g fill="url(#drop)">
    <path d="M8 58 q-4 6 0 9 q4 -3 0 -9z"/><path d="M20 66 q-3 5 0 7 q3 -2 0 -7z"/><path d="M14 80 q-3 5 0 7 q3 -2 0 -7z"/>
    <path d="M120 56 q-4 6 0 9 q4 -3 0 -9z"/><path d="M108 66 q-3 5 0 7 q3 -2 0 -7z"/><path d="M116 80 q-3 5 0 7 q3 -2 0 -7z"/>
    <circle cx="34" cy="14" r="3"/><circle cx="96" cy="8" r="3"/><circle cx="64" cy="6" r="2.5"/>
  </g>
  <!-- 立ち上がり管 -->
  <rect x="58" y="52" width="12" height="62" rx="4" fill="url(#pipe)"/>
  <rect x="55" y="98" width="18" height="8" rx="3" fill="url(#ring)"/>
  <rect x="55" y="66" width="18" height="7" rx="3" fill="url(#ring)"/>
  <rect x="61" y="56" width="2.5" height="40" rx="1.2" fill="#fff" opacity=".7"/>
  <!-- 回転ヘッド -->
  <rect x="50" y="40" width="28" height="16" rx="6" fill="url(#head)"/>
  <path d="M53 44 h18" stroke="#fecdd3" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
  <!-- ノズル -->
  <path d="M56 42 L50 30 L58 27 L63 40Z" fill="url(#nozzle)"/>
  <path d="M71 40 L78 25 L86 29 L77 42Z" fill="url(#nozzle)"/>
  <ellipse cx="54" cy="28.5" rx="4.5" ry="2.5" fill="#374151" transform="rotate(-20 54 28.5)"/>
  <ellipse cx="82" cy="27" rx="4.5" ry="2.5" fill="#374151" transform="rotate(25 82 27)"/>
  <!-- 光沢 -->
  <ellipse cx="57" cy="45" rx="4" ry="2" fill="#fff" opacity=".8" filter="url(#soft)"/>
</svg>
