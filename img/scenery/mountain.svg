<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="far" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b9fd1"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="mid" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f9a7a"/><stop offset="1" stop-color="#2f6f5a"/></linearGradient>
    <linearGradient id="near" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8ccf5f"/><stop offset="1" stop-color="#4f9a34"/></linearGradient>
    <radialGradient id="cloud" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e5edf5"/></radialGradient>
  </defs>
  <rect width="400" height="90" fill="url(#sky)"/>
  <g fill="url(#cloud)">
    <g><ellipse cx="60" cy="18" rx="18" ry="7"/><ellipse cx="74" cy="15" rx="12" ry="8"/><animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0" dur="30s" repeatCount="indefinite"/></g>
    <g><ellipse cx="300" cy="14" rx="16" ry="6"/><ellipse cx="312" cy="11" rx="10" ry="7"/><animateTransform attributeName="transform" type="translate" values="0 0; -30 0; 0 0" dur="26s" repeatCount="indefinite"/></g>
  </g>
  <!-- 遠くの山（雪をかぶる） -->
  <path d="M0 62 L40 34 L70 50 L120 16 L170 52 L210 28 L250 48 L300 12 L350 46 L400 30 V90 H0Z" fill="url(#far)"/>
  <g fill="#ffffff">
    <path d="M120 16 L108 25 L114 24 L120 28 L126 24 L133 26Z"/>
    <path d="M300 12 L287 22 L294 21 L300 25 L306 21 L313 23Z"/>
    <path d="M210 28 L201 35 L210 36 L219 35Z"/>
  </g>
  <!-- 中くらいの山 -->
  <path d="M0 72 L50 46 L90 64 L150 38 L200 66 L250 44 L310 66 L360 42 L400 58 V90 H0Z" fill="url(#mid)"/>
  <g stroke="#7cc6a0" stroke-width="2" fill="none" opacity=".5"><path d="M150 38 L170 54"/><path d="M360 42 L376 54"/><path d="M50 46 L64 56"/></g>
  <!-- 手前の丘 -->
  <path d="M0 80 C60 66 120 74 180 70 C240 66 300 78 360 70 C380 68 392 70 400 72 V90 H0Z" fill="url(#near)"/>
</svg>
