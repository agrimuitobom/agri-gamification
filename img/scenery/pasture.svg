    <g fill="url(#wool)"><circle cx="4" cy="2" r="6"/><circle cx="11" cy="0" r="7"/><circle cx="17" cy="3" r="6"/><circle cx="10" cy="5" r="6"/></g>
    <ellipse cx="23" cy="3" rx="4.5" ry="5.5" fill="#44403c"/><circle cx="25" cy="1" r="1" fill="#fff"/>
