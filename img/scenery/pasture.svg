  <g fill="#86c95a"><path d="M110 70 l3 -9 l3 9z"/><path d="M190 70 l3 -7 l3 7z"/><path d="M270 70 l3 -9 l3 9z"/><path d="M390 70 l3 -8 l3 8z"/></g>
