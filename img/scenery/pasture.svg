    <linearGradient id="fence" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d6d3d1"/></linearGradient>
    <radialGradient id="cow" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d4d4d8"/></radialGradient>
    <radialGradient id="wool" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e7e5e4"/></radialGradient>
    <radialGradient id="hen" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e5e7eb"/></radialGradient>
  </defs>
  <rect width="400" height="70" fill="#e0f2fe"/>
  <path d="M0 22 C100 16 300 18 400 22 V70 H0Z" fill="url(#g)"/>
