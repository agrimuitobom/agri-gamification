  </g>
  <!-- ヒツジ -->
  <g transform="translate(150 44)">
    <rect x="2" y="8" width="3" height="9" fill="#44403c"/><rect x="16" y="8" width="3" height="9" fill="#44403c"/>
    <g fill="url(#wool)"><circle cx="4" cy="2" r="7"/><circle cx="12" cy="0" r="8"/><circle cx="20" cy="3" r="7"/><circle cx="12" cy="6" r="7"/></g>
    <ellipse cx="-3" cy="4" rx="5" ry="6" fill="#44403c"/><circle cx="-5" cy="2" r="1" fill="#fff"/>
