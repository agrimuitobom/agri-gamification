<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0b1d3a"/><stop offset="1" stop-color="#2b4c7e"/></linearGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fffbea"/><stop offset=".6" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".5"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <radialGradient id="dango" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e5e1d8"/></radialGradient>
    <linearGradient id="stand" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e7c08a"/><stop offset="1" stop-color="#a1743f"/></linearGradient>
    <linearGradient id="hill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2f4a3a"/><stop offset="1" stop-color="#1c2f25"/></linearGradient>
  </defs>
  <rect width="400" height="90" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="30" cy="12" r="1.2"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="90" cy="24" r="1"/><circle cx="150" cy="8" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="250" cy="14" r="1"/><circle cx="360" cy="10" r="1.2"><animate attributeName="opacity" values="1;.4;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="380" cy="34" r="1"/></g>
  <!-- 満月 -->
  <circle cx="300" cy="32" r="34" fill="url(#halo)"/>
  <circle cx="300" cy="32" r="20" fill="url(#moon)"/>
  <g fill="#e9b949" opacity=".5"><circle cx="294" cy="28" r="4"/><circle cx="306" cy="38" r="3"/><circle cx="308" cy="24" r="2"/></g>
  <path d="M0 76 C80 66 160 72 240 68 C310 64 360 72 400 70 V90 H0Z" fill="url(#hill)"/>
  <!-- ススキ -->
  <g stroke="#c9b27a" stroke-width="1.6" fill="none" stroke-linecap="round">
    <g><animateTransform attributeName="transform" type="rotate" values="-2 60 86;3 60 86;-2 60 86" dur="5s" repeatCount="indefinite"/>
      <path d="M60 86 Q58 60 50 36"/><path d="M64 86 Q66 58 74 34"/><path d="M56 86 Q50 66 38 48"/></g>
    <g><animateTransform attributeName="transform" type="rotate" values="2 350 86;-3 350 86;2 350 86" dur="6s" repeatCount="indefinite"/>
      <path d="M350 86 Q348 64 342 44"/><path d="M354 86 Q358 62 366 46"/></g>
  </g>
  <g fill="#f3e2b3" opacity=".9">
    <ellipse cx="50" cy="38" rx="2.5" ry="7" transform="rotate(-15 50 38)"/><ellipse cx="74" cy="36" rx="2.5" ry="7" transform="rotate(15 74 36)"/><ellipse cx="39" cy="50" rx="2.5" ry="6" transform="rotate(-35 39 50)"/>
    <ellipse cx="342" cy="46" rx="2.5" ry="7" transform="rotate(-10 342 46)"/><ellipse cx="366" cy="48" rx="2.5" ry="6" transform="rotate(20 366 48)"/>
  </g>
  <!-- 月見だんご（三方） -->
  <g transform="translate(170 0)">
    <path d="M-26 78 H26 L22 88 H-22Z" fill="url(#stand)"/>
    <rect x="-28" y="74" width="56" height="5" rx="2" fill="#d4a86a"/>
    <g fill="url(#dango)" stroke="#d6d0c4" stroke-width=".8">
      <circle cx="-15" cy="68" r="6"/><circle cx="-3" cy="68" r="6"/><circle cx="9" cy="68" r="6"/><circle cx="21" cy="68" r="6" opacity="0"/>
      <circle cx="-9" cy="58" r="6"/><circle cx="3" cy="58" r="6"/><circle cx="-3" cy="48" r="6"/>
    </g>
  </g>
</svg>
