<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 70" preserveAspectRatio="none">
  <defs>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".45" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bankTop" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a3d977"/><stop offset="1" stop-color="#5a9e3a"/></linearGradient>
    <linearGradient id="bankBot" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6fb648"/><stop offset="1" stop-color="#3f7f2a"/></linearGradient>
    <radialGradient id="stone" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f3f4f6"/><stop offset=".6" stop-color="#a8a29e"/><stop offset="1" stop-color="#57534e"/></radialGradient>
    <linearGradient id="reed" x1="0" x2="1"><stop offset="0" stop-color="#4d7c0f"/><stop offset="1" stop-color="#84cc16"/></linearGradient>
  </defs>
  <!-- 奥の土手 -->
  <path d="M0 0 H400 V14 C340 22 300 10 240 18 C180 26 120 12 60 20 C36 23 16 20 0 18Z" fill="url(#bankTop)"/>
  <!-- 川 -->
  <path d="M0 18 C16 20 36 23 60 20 C120 12 180 26 240 18 C300 10 340 22 400 14 V54 C350 62 300 50 240 56 C180 62 120 48 60 56 C36 59 16 56 0 58Z" fill="url(#water)"/>
  <!-- 光の反射（流れるアニメーション） -->
  <g stroke="#e0f7ff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M20 32 q12 -4 24 0"><animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="6s" repeatCount="indefinite"/></path>
    <path d="M110 40 q14 -4 28 0"><animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="7s" repeatCount="indefinite"/></path>
    <path d="M200 30 q12 -4 24 0"><animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="5.5s" repeatCount="indefinite"/></path>
    <path d="M290 42 q14 -4 28 0"><animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="6.5s" repeatCount="indefinite"/></path>
    <path d="M350 30 q10 -3 20 0"><animateTransform attributeName="transform" type="translate" values="0 0; 25 0; 0 0" dur="6s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#ffffff" opacity=".55">
    <ellipse cx="70" cy="44" rx="3" ry="1.2"/><ellipse cx="160" cy="28" rx="3" ry="1.2"/><ellipse cx="250" cy="46" rx="3" ry="1.2"/><ellipse cx="330" cy="36" rx="3" ry="1.2"/>
  </g>
  <!-- 石 -->
  <ellipse cx="96" cy="50" rx="9" ry="5" fill="url(#stone)"/>
  <ellipse cx="108" cy="53" rx="5" ry="3" fill="url(#stone)"/>
  <ellipse cx="272" cy="24" rx="7" ry="4" fill="url(#stone)"/>
  <!-- 手前の土手 -->
  <path d="M0 58 C16 56 36 59 60 56 C120 48 180 62 240 56 C300 50 350 62 400 54 V70 H0Z" fill="url(#bankBot)"/>
  <!-- アシ（ヨシ） -->
  <g stroke="url(#reed)" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M24 66 q-2 -14 -6 -22"/><path d="M28 66 q1 -16 4 -24"/><path d="M32 66 q3 -12 9 -18"/>
    <path d="M372 64 q-2 -14 -6 -22"/><path d="M376 64 q1 -16 4 -24"/><path d="M380 64 q3 -12 9 -18"/>
    <path d="M190 8 q-2 -6 -4 -8"/><path d="M194 8 q1 -6 3 -8"/>
  </g>
  <g fill="#92400e"><ellipse cx="18" cy="44" rx="2.2" ry="5"/><ellipse cx="32" cy="42" rx="2.2" ry="5"/><ellipse cx="366" cy="42" rx="2.2" ry="5"/><ellipse cx="380" cy="42" rx="2.2" ry="5"/></g>
  <!-- 草のアクセント -->
  <g fill="#86c95a"><path d="M140 70 l4 -9 l3 9z"/><path d="M220 70 l3 -7 l3 7z"/><path d="M300 70 l4 -9 l3 9z"/></g>
</svg>
