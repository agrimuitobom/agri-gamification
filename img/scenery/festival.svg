<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4c3b8f"/><stop offset=".55" stop-color="#e2668c"/><stop offset="1" stop-color="#fbbf77"/></linearGradient>
    <radialGradient id="lan" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff1c2"/><stop offset=".45" stop-color="#f87171"/><stop offset="1" stop-color="#b91c1c"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a" stop-opacity=".9"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#5b3419"/><stop offset=".5" stop-color="#9a6a42"/><stop offset="1" stop-color="#4a2c17"/></linearGradient>
    <linearGradient id="roof" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
    <symbol id="ch" viewBox="-8 -12 16 24">
      <circle r="13" fill="url(#glow)"/>
      <rect x="-3" y="-11" width="6" height="3" rx="1" fill="#1f2937"/>
      <ellipse rx="7" ry="8.5" fill="url(#lan)"/>
      <g stroke="#7f1d1d" stroke-width=".7" opacity=".6"><path d="M-7 -3 H7"/><path d="M-7 3 H7"/></g>
      <rect x="-3" y="8" width="6" height="3" rx="1" fill="#1f2937"/>
    </symbol>
  </defs>
  <rect width="400" height="90" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8"><circle cx="40" cy="10" r="1"/><circle cx="120" cy="6" r="1.2"/><circle cx="260" cy="9" r="1"/><circle cx="350" cy="5" r="1.2"/></g>
  <!-- やぐら -->
  <g transform="translate(200 0)">
    <rect x="-30" y="44" width="5" height="40" fill="url(#wood)"/><rect x="25" y="44" width="5" height="40" fill="url(#wood)"/>
    <rect x="-32" y="56" width="64" height="5" fill="#7c4a26"/>
    <path d="M-40 46 L0 26 L40 46Z" fill="url(#roof)"/>
    <rect x="-34" y="46" width="68" height="4" fill="#fde68a"/>
    <path d="M-30 61 h60 v6 h-60z" fill="#ffffff"/><path d="M-30 61 h15 v6 h-15z M0 61 h15 v6 h-15z" fill="#dc2626"/>
  </g>
  <!-- ちょうちんの列 -->
  <path d="M0 22 Q100 44 200 26 T400 22" stroke="#1f2937" stroke-width="1.2" fill="none"/>
  <g>
    <animate attributeName="opacity" values=".85;1;.85" dur="2s" repeatCount="indefinite"/>
    <use href="#ch" x="12" y="18" width="18" height="26"/><use href="#ch" x="56" y="26" width="18" height="26"/><use href="#ch" x="100" y="30" width="18" height="26"/>
    <use href="#ch" x="144" y="28" width="18" height="26"/><use href="#ch" x="236" y="24" width="18" height="26"/><use href="#ch" x="280" y="18" width="18" height="26"/>
    <use href="#ch" x="324" y="16" width="18" height="26"/><use href="#ch" x="368" y="18" width="18" height="26"/>
  </g>
  <!-- 地面と人影 -->
  <path d="M0 80 C100 74 300 74 400 80 V90 H0Z" fill="#3b2a4a"/>
  <g fill="#2a1d36"><circle cx="70" cy="72" r="4"/><rect x="66" y="75" width="8" height="10" rx="3"/><circle cx="84" cy="74" r="3"/><rect x="81" y="76" width="6" height="8" rx="3"/><circle cx="320" cy="72" r="4"/><rect x="316" y="75" width="8" height="10" rx="3"/><circle cx="336" cy="73" r="3.5"/><rect x="332" y="76" width="7" height="9" rx="3"/></g>
</svg>
